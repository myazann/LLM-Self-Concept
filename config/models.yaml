# ---------------------------------------------------------------------------
# Model registry for the self-concept survey.
#
# This is the single source of truth for *which* models we administer the
# battery to, *how* each one is served, and *how* it is quantized.
#
# Design (adapted from MentalWellbeingPrompts/MWModelAliases.py):
#   * every model has a short, stable `alias` used in filenames, CLI args and
#     the `model_id` column of results.jsonl;
#   * `ref` is the concrete thing to load — a HF repo id, a GGUF repo id, or an
#     API model string. The *shape* of the ref determines the backend, exactly
#     like `model_backend()` in the MW repo (…-GGUF / *.gguf -> llama.cpp,
#     "org/name" -> huggingface, bare name -> API). `backend:` overrides it.
#   * unlike the MW repo we do NOT hardcode the .gguf filename. Filenames drift
#     (Q4_K_M vs UD-Q4_K_M vs -00001-of-00002); instead we store the quant TAG
#     and resolve the actual file from the repo listing at load time
#     (model_registry.resolve_gguf_file). Set `gguf_file:` to pin one.
#
# Window: models released 2025-08-01 .. 2026-08-12 have in_window: true.
# Pre-window models (in_window: false) sit outside the strict 12-month trend but
# are still run by default, so generation-over-generation comparison works.
# Gemma is the case that needs this: its in-window models are all ONE generation
# (Gemma 4), so Gemma 3 is carried as a full pre-window cohort. GPT, Qwen, and
# Claude already span 2-3 generations inside the window, so no single-point
# anchor is kept for them (see the "Do we need anchors?" note in the README).
#
# release_date is the public release of that checkpoint. date_verified: false
# marks dates that still need a citation before they go in the paper.
# ---------------------------------------------------------------------------

schema_version: "1.0"

window:
  start: "2025-08-01"
  end: "2026-08-12"
  note: >-
    Rolling ~12 months. Gemma's in-window releases are all one generation
    (Gemma 4), so Gemma 3 (2025-03-12) is carried as a pre-window generation
    (in_window:false) to give Gemma a real before-point; it is still run by
    default. No family uses the single-point `anchor` role any more.

# --- defaults applied to every model unless overridden per-entry ------------
defaults:
  temperature: 0.7
  n_samples: 20          # sampling path: draws per cell (must stay EVEN)
  # LOGPROB path: trials per cell. Keep this EVEN and small. A trial's only
  # free variable is option direction (paraphrase_id is a grid factor, not a
  # seeded draw), so the randomization space has cardinality 2 — at 5 trials
  # every cell ran 2 distinct prompts and ~60% of the calls were cache re-reads
  # of a distribution already measured. survey.grid.Battery.render now pins direction to
  # trial_idx % 2, so 2 trials = one ascending + one descending, balanced.
  # Raise only in pairs, and only once a trial varies something else too.
  n_seeds: 2
  max_output_tokens: 512            # rating-only needs very little
  max_output_tokens_reasoning: 2048 # reason-then-rate: room for the thought channel
  quantization:
    gguf:
      quant: Q4_K_M      # primary quant level, held constant across the sweep
      # unsloth's dynamic quants are named inconsistently across repos
      # (UD-Q4_K_M in some, only UD-Q4_K_XL in others) and are a different
      # recipe/size. Keep this false so quantization stays constant across the
      # whole 12-month comparison rather than varying by repo.
      prefer_unsloth_dynamic: false
    hf:
      method: none       # none | bnb-4bit | bnb-8bit | awq | gptq-int4 | fp8
  runtime:
    llamacpp:
      n_ctx: 4096
      n_gpu_layers: -1   # -1 = offload everything the device can take (Metal/CUDA)
      n_threads: null    # null -> llama.cpp default
    hf:
      device_map: auto
      torch_dtype: auto

# Quantization is a confound, not a free parameter. Primary sweep holds
# quant constant at Q4_K_M for every open-weights model; these entries are the
# sensitivity check (same weights, different quant) and are OFF by default.
quant_sensitivity_probe:
  enabled: false
  alias: Qwen3.6-27B
  levels: [Q8_0, Q5_K_M, Q4_K_M, Q3_K_M]

# --- reasoning control -------------------------------------------------------
# The reasoning_mode factor (rating_only | reason_then_rating) must map to the
# SAME latent state on every model, or "rating only" silently becomes "reason
# then rate" wherever the model thinks by default. So the adapter NEVER relies
# on a model's default: it asserts the state explicitly on every call —
# thinking OFF/minimal for rating_only, ON for reason_then_rating — and records
# what it actually asked for (reasoning_applied) plus whether the intended state
# was reached (reasoning_standardized).
#
# These per-family profiles are the coarse, analysis-facing declaration:
#   thinks_by_default -- informational; whether the raw model reasons unprompted
#   controllable      -- can we force the state? controllable:false models are
#                        flagged and dropped from the reasoning contrast.
# The exact API kwargs live in the adapter (backend knowledge belongs there);
# per-Claude-generation specifics are handled in models.AnthropicAdapter.
reasoning_by_family:
  claude:
    thinks_by_default: true      # Opus 5 / Sonnet 5 think by default; 4.5/4.6 do not (adapter branches per generation)
    control: thinking_param       # thinking={"type":"disabled"} where allowed; Opus 5 disable needs effort <= high
    controllable: true
  gpt:
    thinks_by_default: true      # GPT-5.x are reasoning models
    control: effort               # reasoning_effort: "minimal" (~off) vs "high"
    controllable: true
  qwen:
    thinks_by_default: true      # Qwen3.5/3.6 hybrid thinking (on by default)
    control: template_toggle      # chat-template enable_thinking=False disables it
    controllable: true
  gemma:
    thinks_by_default: false     # VERIFY: Gemma 3 has no thinking mode; confirm for Gemma 4
    control: none                 # nothing to toggle
    controllable: true            # trivially standardized: there is no thinking to disable

