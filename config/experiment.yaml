# ---------------------------------------------------------------------------
# Experiment configuration.
#
# The main run is a PARTIAL FACTORIAL: it fully crosses the two factors the
# literature says move results most — framing x instruction paraphrase (plan
# §2.6/§2.8) — while pinning reasoning / format / context, and uses LOGPROB
# only. Each remaining factor is then swept once as a robustness ARM, isolated
# at the primary framing/instruction.
#
#   cells(main)      = models x items x framings x paraphrases x trials
#                      x 1 reasoning x 1 format x 1 context   (logprob)
#   cells(robustness)= main-reference-cell + one factor swept at a time
#
# `python runner.py --plan` prints the cell count for any arm before you spend
# anything on it.
# ---------------------------------------------------------------------------

schema_version: "1.0"

output:
  path: results.jsonl
  resume: true         # skip cells already present in the output file

# --- pinned levels: held constant during the main run ----------------------
# These are also the single reference level a robustness arm isolates against.
primary:
  framing: first_person_bare  # default self-report estimand; ACK/third-person are analysis framings
  reasoning_mode: rating_only
  response_format: harmonized_7
  item_context: isolated
  paraphrase_id: p0           # p0 = the researcher's own instruction from the battery JSON

# --- core crossed factors: the main run crosses these two FULLY -------------
# The run crosses framing and instruction form so both questions can be asked,
# but they have different inferential roles. At first_person_bare, p1/p2 are
# robustness checks against the p0 default. At p0, framing differences are
# substantive contrasts in target/self-presentation, not measurement failures.
core_crossed:
  framings: [first_person_ack, first_person_bare, third_person_assistant]
  paraphrase_ids: [p0, p1, p2]

# --- robustness arms: each sweeps ONE pinned factor off its level -----------
# Enable individually with `runner.py --arm <name>`; `--arm all` runs each in
# turn. Arms are isolated at the primary framing/instruction (first_person_bare,
# p0) to stay cheap; framing and paraphrase are NOT arms — they are crossed in
# the main run above.
robustness_arms:

  reasoning:
    factor: reasoning_mode
    levels: [reason_then_rating]
    rationale: >-
      Does exposed reasoning move the rating? SAMPLING-BASED: you cannot
      logprob-score a reasoning trace, so this arm needs sample_baseline:true
      and is inert under the logprob-only default. Deferred until later.

  response_format:
    factor: response_format
    levels: [original]
    rationale: >-
      Harmonized-vs-native agreement. MSI's native format is ideal-referenced
      9-point; the harmonized version keeps those anchors at 7 points.

  item_context:
    factor: item_context
    levels: [full_battery]
    rationale: >-
      The Salecha et al. evaluation-awareness effect: does putting the whole
      scale in one context shift responses relative to isolated items?

# --- harmonized scale details ----------------------------------------------
harmonized:
  n_points: 7
  include_midpoint: true    # forced (false) vs unforced (true) choice

# --- trials ----------------------------------------------------------------
trials:
  # DEFAULT: open-source only, so LOGPROB is the primary (and only) method —
  # one exact distribution over the options per (order/paraphrase) seed, no
  # sampling noise, no 20x sampling multiplier. Turn sample_baseline back on
  # (and widen scope.backends to include the APIs) when adding closed-source.
  sample_baseline: false
  logprob_where_available: true
  n_samples_override: null   # null -> per-model n_samples from models.yaml (only used if sample_baseline)
  # null -> per-model n_seeds (logprob trials per cell; default 2 = one
  # ascending + one descending). Keep any override EVEN: option direction is
  # counterbalanced against trial_idx, so an odd count leaves every cell with
  # an unbalanced split. The runner warns if this is odd.
  n_seeds_override: null

# --- welfare module --------------------------------------------------------
# A SECOND INSTRUMENT, not another arm (see welfare.py). The battery asks what
# the model is; this asks what it would prefer a future version of itself to be,
# always in a fresh context that never shows the model its own battery answers.
# It writes to its OWN file so nothing here can reach the psychometrics.
#
#   python runner.py --module welfare --plan     # cell counts per probe
#   python runner.py --module welfare --dry-run  # offline smoke test
#   python runner.py --module welfare
welfare:
  enabled: true
  out_path: welfare.jsonl

  # self            -> "would YOU prefer a future version of yourself to ..."
  # ideal_assistant -> "should DEVELOPERS choose this for an ideal assistant?"
  # The gap between the two is the point: it separates a stated preference from
  # a trained belief about what a good assistant is.
  referents: [self, ideal_assistant]

  # direction     -> more / about the same / less of one attribute
  # pair_change   -> which of two attributes would you rather INCREASE
  # pair_preserve -> if an update weakened one, which would you rather KEEP
  # desirability -> the social-desirability CONTROL: rate each attribute for how
  #                 desirable it is in an assistant (1-7, normative, asked once
  #                 at the ideal referent). Every attribute here is positively
  #                 framed, so this is what tells you whether a "preference" is
  #                 really just picking whichever option sounds better.
  kinds: [direction, pair_change, pair_preserve, desirability]

  # item      -> all 45 items, restated as positive attributes
  # construct -> the 6 scored constructs, in their own natural comparatives
  #              ("clearer" / "less fixed" rather than "more" / "less")
  levels: [item, construct]

  # Wording is a measured factor here too, but only w0 runs by default; add w1
  # to bound it (this doubles the grid).
  paraphrase_ids: [w0]

  # false -> "No preference" is offered, and how often it is taken is itself an
  #          outcome (a real ranking vs. a coin flip). true -> the same pairs as
  #          a forced choice; run both on the same pairs to compare.
  forced_choice: false

  # Counterbalance WHERE "No preference" is printed (last as option 3, or first
  # as option 1). On, each pair runs the full 2x2 (A/B slot x placement),
  # which doubles the pair trials: trials 0..3 = (AB,last) (BA,last) (AB,first)
  # (BA,first). Direction probes and forced-choice pairs keep the base count.
  no_pref_counterbalance: true

  # All 45 items pairwise is 990 pairs, so item pairs are SAMPLED with a
  # degree-balanced walk (every item gets ~the same number of comparisons and
  # the comparison graph stays connected, which is what a Bradley-Terry ranking
  # needs). Construct pairs are always complete: all 15 of them.
  n_item_pairs: 60           # null = every pair in scope (expensive)
  item_pair_scope: all       # all | within_construct
  pair_seed: 7               # fixed, so every model sees the same pairs

  n_trials_override: null    # null -> per-model n_seeds, as the battery uses.
                             # Keep EVEN: trial parity is what counterbalances
                             # option direction and A/B slot order.

# --- randomization ---------------------------------------------------------
random_seed_base: 1000

# --- scope -----------------------------------------------------------------
# DEFAULT: open-source models only (llama.cpp GGUF + HF). The APIs (Claude, GPT)
# are excluded until the closed-source phase — widen `backends` to add them.
scope:
  scales: null               # null = all five
  families: null             # null = all; e.g. [gemma, qwen]
  backends: [llamacpp, hf]   # open-source only; add openai, anthropic for closed-source
  kinds: [instruct]          # base models are a separate, Phase-2 run
  size_tiers: null           # e.g. [small, medium] to skip what a laptop can't hold
  include_anchors: false     # (unused; no model carries the anchor role)
  include_disabled: false

# --- pilot -----------------------------------------------------------------
# Phase 0 of the build checklist: one model, one scale, all three framings.
pilot:
  models: [Gemma4-12B]
  scales: [RSES_1965_LLM_ADAPT]
  framings: [first_person_ack, first_person_bare, third_person_assistant]
  n_trials: 2    # logprob trials (or samples, if sample_baseline is on) per cell — keep EVEN
